# Opcjonalny proxy dla samodzielnego serwera bez istniejącego HTTPS.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Ustaw APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Ustaw ACME_EMAIL}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
